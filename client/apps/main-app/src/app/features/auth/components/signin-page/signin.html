<div class="signin-container">
  <form action="">
    <h2>Sign In</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        required
        [(ngModel)]="username"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        [(ngModel)]="password"
      />
    </div>

    <div>
      <button (click)="signIn()">Sign In</button>
      <p>Don't have an account? <a routerLink="/auth/signup">Sign Up</a></p>
    </div>
  </form>
</div>

@if(response()) {
<div class="msg-box-container">
  <img src="/assets/msg-box.png" alt="" />
  <p>{{ response() }}</p>
</div>
}
